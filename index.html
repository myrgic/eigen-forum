<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>THESEUS</title>
<!-- Installable: home-screen app, standalone, offline shell (never the API). -->
<meta name="theme-color" content="#0d0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="THESEUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  THESEUS mobile shell — chat + node, one page (RFC-039).

  The book's public-shell pattern generalized. This file holds ZERO data and ZERO
  private names: the config paste supplies owner/repo/branch at runtime, exactly
  as the book client discovers its repo from the key. That is deliberate and
  load-bearing — the repo-side chat/index.html hardcodes the private repo name in
  three places, which is why it cannot itself be published anywhere.

  CHAT reads conversations/ledger.json and writes turns as receipts into
  conversations/inbox/, which the conversations-ingest workflow settles. Trust is
  commit identity; the PAT is the operator's own, scoped to one repo.

  NODE reads constellation.json off the snapshot branch and can send intent
  receipts (refresh / speak) that the publisher settles on the machine.

  Shipping this to a public Pages repo is an operator-gated membrane decision
  (conversations/README.md reserves that crossing explicitly). Before shipping:
  grep the file for any private repo name — it should find nothing.

  #demo renders inline sample data with no network and no credentials.
-->
<style>
  :root{
    --bg:#0d0b12; --panel:#16121f; --edge:#2a2338; --ink:#d8d3e4; --dim:#8a819f;
    --accent:#a78bfa; --accent-dim:#7c5fd3; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --mine:#241d33; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,system-ui,sans-serif;
       display:flex;flex-direction:column;
       padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:10px;padding:4px 2px 10px;flex:0 0 auto}
  header h1{font-size:16px;letter-spacing:.18em;color:var(--accent);font-weight:600}
  #asof{font:11px var(--mono);color:var(--dim);margin-left:auto}
  nav{display:flex;gap:6px;flex:0 0 auto;margin-bottom:10px}
  nav button{flex:1;background:var(--panel);border:1px solid var(--edge);color:var(--dim);
             border-radius:8px;padding:8px;font:12px var(--mono);letter-spacing:.1em;cursor:pointer}
  nav button.on{background:var(--accent-dim);border-color:var(--accent-dim);color:#fff}
  .view{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
  .view.on{display:flex}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
         padding:11px 13px;margin-bottom:10px}
  .panel h2{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin-bottom:7px}
  table{border-collapse:collapse;width:100%;font:12px var(--mono)}
  td,th{padding:3px 8px 3px 0;text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
  th{color:var(--dim);font-weight:400}
  .scroll{overflow-x:auto}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .ok{background:var(--ok)} .warn{background:var(--warn)} .bad{background:var(--bad)}
  .tag{font:10px var(--mono);color:var(--accent);background:var(--mine);border-radius:4px;padding:1px 6px}
  input,textarea,button,select{font:14px var(--mono);color:var(--ink);background:#0f0c16;
       border:1px solid var(--edge);border-radius:8px;padding:9px 10px;width:100%}
  input:focus,textarea:focus{outline:1px solid var(--accent-dim)}
  button.go{background:var(--accent-dim);border:none;color:#fff;font-weight:600;width:auto;padding:9px 16px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--edge);color:var(--dim);width:auto;padding:9px 14px;cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{font-size:11px;color:var(--dim)}
  #err{color:var(--bad);font:11px var(--mono);white-space:pre-wrap}
  /* chat */
  #log{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0 8px}
  .turn{margin-bottom:12px}
  .meta{font:10px var(--mono);color:var(--dim);margin-bottom:3px}
  .body{overflow-wrap:anywhere;background:var(--panel);
        border:1px solid var(--edge);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.6}
  .turn.mine .body{background:var(--mine);border-color:var(--accent-dim)}
  /* markdown rendering (see mdRender in script — escape-first, whitelist-tag output) */
  .md-body>*:first-child{margin-top:0} .md-body>*:last-child{margin-bottom:0}
  .md-p{margin:0 0 10px}
  .md-h{color:var(--accent);font-weight:600;margin:14px 0 7px;line-height:1.3}
  .md-h:first-child{margin-top:0}
  .md-h1{font-size:1.3em;padding-bottom:5px;border-bottom:1px solid var(--edge)}
  .md-h2{font-size:1.15em;padding-bottom:4px;border-bottom:1px solid var(--edge)}
  .md-h3{font-size:1.05em}
  .md-h4,.md-h5,.md-h6{font-size:.85em;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .md-body strong{color:#fff;font-weight:700}
  .md-body em{font-style:italic}
  .md-body del{color:var(--dim)}
  .md-body code{font:.85em var(--mono);background:#0a0810;border:1px solid var(--edge);
        border-radius:4px;padding:1px 5px;white-space:pre-wrap;overflow-wrap:anywhere}
  .md-pre{background:#0a0810;border:1px solid var(--edge);border-radius:8px;
        padding:10px 12px;margin:0 0 10px;overflow-x:auto}
  .md-pre code{background:none;border:none;padding:0;white-space:pre;font-size:12.5px;display:block}
  .md-list{margin:0 0 10px;padding-left:1.35em}
  .md-list .md-list{margin:4px 0 0}
  .md-li{margin:3px 0}
  .md-li::marker{color:var(--accent)}
  .md-bq{margin:0 0 10px;padding:1px 12px;border-left:3px solid var(--accent-dim);color:var(--dim)}
  .md-bq .md-p:last-child{margin-bottom:0}
  .md-hr{border:none;border-top:1px solid var(--edge);margin:12px 0}
  .md-table-wrap{margin:0 0 10px}
  .md-table{border-collapse:collapse;width:100%;font-size:.87em}
  .md-table th,.md-table td{border:1px solid var(--edge);padding:5px 9px;text-align:left}
  .md-table th{background:#1c1728;color:var(--accent);font-weight:600}
  .md-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
  .md-body a{color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent-dim)}
  .md-body a:visited{color:var(--accent)}
  /* svg artifact card (see sanitizeSvg/svgArtifactDoc in script) */
  .artifact{margin-top:8px}
  .artifact-label{font:10px var(--mono);color:var(--accent);letter-spacing:.1em;
        text-transform:uppercase;margin-bottom:5px}
  .artifact-svg{background:#0f0c16;border:1px solid var(--accent-dim);border-radius:10px;
        padding:10px;max-width:320px}
  .artifact-frame{display:block;width:100%;aspect-ratio:1/1;border:0;background:transparent}
  /* channel-link pill: [#name] in turn text -> in-page channel switch (see setChannel) */
  .chan-pill{display:inline-flex;align-items:center;background:var(--mine);
        border:1px solid var(--accent-dim);color:var(--accent);border-radius:999px;
        font:12px var(--mono);font-weight:600;padding:7px 13px;margin:1px 2px;
        cursor:pointer;line-height:1;-webkit-tap-highlight-color:transparent}
  .chan-pill:active{background:var(--accent-dim);color:#fff}
  .composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding-top:8px}
  .composer textarea{resize:none;min-height:44px;max-height:140px}
  #pending{font:10px var(--mono);color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>THESEUS</h1>
  <select id="thread" style="width:auto;padding:5px 8px;font-size:12px"></select>
  <span id="asof">—</span>
</header>

<nav>
  <button id="tab-chat" class="on">CHAT</button>
  <button id="tab-node">NODE</button>
  <button id="tab-cfg">⚙</button>
</nav>

<!-- CHAT -->
<section id="v-chat" class="view on">
  <div id="log"></div>
  <div id="pending"></div>
  <div class="composer">
    <textarea id="msg" rows="1" placeholder="message…"></textarea>
    <button class="go" id="send">Send</button>
  </div>
</section>

<!-- NODE -->
<section id="v-node" class="view">
  <div style="overflow-y:auto;flex:1 1 auto">
    <div class="panel"><h2>Node</h2><div id="p-node">—</div></div>
    <div class="panel"><h2>Topology</h2><div id="p-topo">—</div></div>
    <div class="panel"><h2>Sessions</h2><div class="scroll" id="p-sessions">—</div></div>
    <div class="panel"><h2>Voice · Inference</h2><div id="p-voice">—</div></div>
    <div class="panel"><h2>Intents</h2>
      <div class="row" style="margin-bottom:8px"><button class="go" id="i-refresh">Refresh snapshot</button></div>
      <textarea id="i-speak-text" rows="2" placeholder="text for the node to speak aloud"></textarea>
      <div class="row" style="margin-top:8px"><button class="go" id="i-speak">Speak on node</button>
        <span class="note">acted next publisher cycle</span></div>
      <div id="intent-log" class="note"></div>
    </div>
  </div>
</section>

<!-- CONFIG -->
<section id="v-cfg" class="view">
  <div class="panel">
    <h2>Connection</h2>
    <div style="display:grid;gap:8px">
      <input id="cfg-repo" placeholder="owner/repo (the private one)" autocomplete="off" spellcheck="false">
      <input id="cfg-token" type="password" placeholder="fine-grained PAT · Contents read+write · that repo only" autocomplete="off">
      <input id="cfg-device" placeholder="device name (e.g. fold)" autocomplete="off" spellcheck="false">
      <input id="cfg-snap" placeholder="snapshot branch (default constellation-live)" autocomplete="off" spellcheck="false">
      <input id="cfg-snaprepo" placeholder="snapshot owner/repo (optional, if different)" autocomplete="off" spellcheck="false">
      <div class="row">
        <button class="go" id="cfg-save">Connect</button>
        <button class="ghost" id="cfg-clear">Forget</button>
      </div>
      <div class="note">Stored in this browser only. Sent to api.github.com and nowhere else.</div>
      <div id="err"></div>
    </div>
  </div>
</section>

<script>
"use strict";
var API='https://api.github.com', POLL_MS=2500; /* was 10000 -- 2026-07-24 latency pass:
  the ~25s Action settle is the dominant cost either way, but a tighter read-side poll still
  shaves several seconds of average wait off a turn that's already landed on origin/main. */
var K={repo:'th-repo',token:'th-token',dev:'th-dev',snap:'th-snap',snaprepo:'th-snaprepo',thread:'th-thread'};
var demo=location.hash==='#demo';
var cfg={}, timer=null, pending=[], lastIds={};
var svgDocs=[]; /* reset per renderChat() pass; collects BOTH turn.artifact and fenced-```svg
  sources (see svgArtifactPlaceholder below) so a single post-render loop wires every iframe */

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function load(){try{for(var k in K)cfg[k]=localStorage.getItem(K[k])}catch(e){}
  cfg.snap=cfg.snap||'constellation-live'; cfg.dev=cfg.dev||'phone'; cfg.thread=cfg.thread||'theseus-mobile'}
function save(){try{for(var k in K)if(cfg[k]!=null)localStorage.setItem(K[k],cfg[k])}catch(e){}}
function hdr(raw){return {'Authorization':'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28',
  'Accept': raw?'application/vnd.github.raw+json':'application/vnd.github+json'}}
function snapRepo(){return cfg.snaprepo||cfg.repo}

/* ---------- markdown (self-contained, no libs — CSP is default-src 'none') ----------
   Security model: escape ALL of the raw text to HTML entities FIRST (esc(), above),
   before any markdown parsing runs. Every subsequent regex matches literal markdown
   syntax characters (# * _ ` > - | etc.) inside that already-escaped string and
   substitutes in a FIXED whitelist of our own tags (p/h1-6/strong/em/del/code/pre/
   ul/ol/li/blockquote/hr/table/a). User text is never re-parsed as HTML and never
   reaches innerHTML except wrapped as escaped entities or literal text nodes inside
   those whitelisted tags. Note '>' and '<' in the source are already '&gt;'/'&lt;'
   by this point, so e.g. the blockquote-marker check matches the escaped '&gt;'. */
function safeHref(u){
  var s=String(u||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();
  if(/^(https?:\/\/|mailto:)[^\s<>"']+$/i.test(s))return esc(s);
  return null; /* javascript:, data:, vbscript:, relative, or anything else -> rejected */
}
function emphasize(s){
  s=s.replace(/~~(?!\s)([^\n~]+?)(?<!\s)~~/g,function(_,t){return '<del>'+t+'</del>'});
  s=s.replace(/\*\*(?!\s)([^\n*]+?)(?<!\s)\*\*/g,function(_,t){return '<strong>'+t+'</strong>'});
  s=s.replace(/__(?!\s)([^\n_]+?)(?<!\s)__/g,function(_,t){return '<strong>'+t+'</strong>'});
  s=s.replace(/\*(?!\*|\s)([^\n*]+?)(?<!\s)\*(?!\*)/g,function(_,t){return '<em>'+t+'</em>'});
  s=s.replace(/\b_(?!_|\s)([^\n_]+?)(?<!\s)_\b/g,function(_,t){return '<em>'+t+'</em>'});
  return s;
}
function renderInline(s){
  var stash=[];
  function keep(html){stash.push(html);return '\u0001'+(stash.length-1)+'\u0002'}
  s=s.replace(/`([^`\n]+?)`/g,function(_,code){return keep('<code>'+code+'</code>')});
  /* channel-link pill: [#name] -> a tappable pill that switches THIS shell's own channel
     in-page (setChannel below), never a URL, never a link. The capture group IS the
     strict boundary -- only A-Za-z0-9._- ever becomes a pill; anything else (a scheme,
     a bracket, a slash, `javascript:`, an external URL) simply fails to match and is left
     as inert literal text, same allowlist posture as safeHref just above. setChannel()
     re-checks the identical charset before acting, defense-in-depth on top of this. */
  s=s.replace(/\[#([A-Za-z0-9._-]+)\]/g,function(_,name){
    return keep('<button type="button" class="chan-pill" data-channel="'+esc(name)+'">#'+esc(name)+'</button>');
  });
  s=s.replace(/\[([^\[\]\n]+)\]\(\s*([^()\s][^()]*?)\s*\)/g,function(_,text,url){
    var href=safeHref(url), inner=emphasize(text);
    if(href)return keep('<a href="'+href+'" target="_blank" rel="noopener noreferrer">'+inner+'</a>');
    return keep('['+text+']('+url+')'); /* dead link: rendered as plain text, never an <a> */
  });
  s=emphasize(s);
  s=s.replace(/\u0001(\d+)\u0002/g,function(_,i){return stash[+i]});
  return s;
}
function listItemMatch(line){
  var m=line.match(/^( *)([-*+])( +)(.*)$/);
  if(m)return {indent:m[1].length,ordered:false,contentCol:m[1].length+m[2].length+m[3].length,content:m[4]};
  m=line.match(/^( *)(\d{1,9})([.)])( +)(.*)$/);
  if(m)return {indent:m[1].length,ordered:true,contentCol:m[1].length+m[2].length+1+m[4].length,content:m[5]};
  return null;
}
function splitRow(line){
  var t=line.trim().replace(/^\|/,'').replace(/\|$/,''), cells=[], cur='';
  for(var k=0;k<t.length;k++){
    var c=t[k];
    if(c==='\\'&&t[k+1]==='|'){cur+='|';k++;continue}
    if(c==='|'){cells.push(cur);cur='';continue}
    cur+=c;
  }
  cells.push(cur);
  return cells.map(function(c){return c.trim()});
}
function parseTable(lines,i,n){
  var header=splitRow(lines[i]);
  var aligns=splitRow(lines[i+1]).map(function(c){
    var l=/^:/.test(c),r=/:$/.test(c); return l&&r?'center':r?'right':l?'left':'';
  });
  var j=i+2, rows=[];
  while(j<n&&/\|/.test(lines[j])&&!/^[ \t]*$/.test(lines[j])){rows.push(splitRow(lines[j]));j++}
  var thead='<tr>'+header.map(function(h,k){
    return '<th'+(aligns[k]?' style="text-align:'+aligns[k]+'"':'')+'>'+renderInline(h)+'</th>'}).join('')+'</tr>';
  var tbody=rows.map(function(r){
    return '<tr>'+r.map(function(c,k){
      return '<td'+(aligns[k]?' style="text-align:'+aligns[k]+'"':'')+'>'+renderInline(c||'')+'</td>'}).join('')+'</tr>'
  }).join('');
  return {html:'<div class="md-table-wrap scroll"><table class="md-table"><thead>'+thead+
    '</thead><tbody>'+tbody+'</tbody></table></div>',next:j};
}
function parseList(lines,i,n,indent,ordered){
  var items=[], j=i;
  while(j<n){
    var lim=listItemMatch(lines[j]);
    if(!lim||lim.indent!==indent||lim.ordered!==ordered)break;
    var contentCol=lim.contentCol, itemLines=[lim.content]; j++;
    while(j<n){
      var lj=lines[j];
      if(/^[ \t]*$/.test(lj)){
        var next=lines[j+1];
        if(next!=null&&next.trim()!==''&&(next.match(/^[ \t]*/)||[''])[0].length>=contentCol){
          itemLines.push('');j++;continue;
        }
        break;
      }
      var lineIndent=(lj.match(/^[ \t]*/)||[''])[0].length;
      if(lineIndent>=contentCol){itemLines.push(lj.slice(contentCol));j++;continue}
      var slim=listItemMatch(lj);
      if(slim&&lineIndent===indent)break;
      if(lineIndent>indent&&!slim){itemLines.push(lj.slice(Math.min(contentCol,lj.length)));j++;continue}
      break;
    }
    while(itemLines.length&&/^[ \t]*$/.test(itemLines[itemLines.length-1]))itemLines.pop();
    var bodyHtml=renderBlocksFrom(itemLines);
    var tight=bodyHtml.replace(/^<p class="md-p">([\s\S]*)<\/p>$/,'$1');
    items.push('<li class="md-li">'+tight+'</li>');
  }
  var tag=ordered?'ol':'ul';
  return {html:'<'+tag+' class="md-list">'+items.join('')+'</'+tag+'>',next:j};
}
function parseBlock(lines,i,n){
  var line=lines[i];
  var fm=line.match(/^ {0,3}(`{3,}|~{3,})[ \t]*([\w#+.-]*)[ \t]*$/);
  if(fm){
    var ch=fm[1][0],len=fm[1].length,lang=fm[2]||'',body=[],j=i+1;
    while(j<n){
      var cm=lines[j].match(/^ {0,3}(`{3,}|~{3,})[ \t]*$/);
      if(cm&&cm[1][0]===ch&&cm[1].length>=len){j++;break}
      body.push(lines[j]);j++;
    }
    /* fenced ```svg — the write path: a turn posted through conversations.py append --text
       (plain text, no structured artifact field) can still carry a renderable SVG this way.
       The fenced content is untrusted exactly like turn.artifact.svg and goes through the
       SAME unescape -> sanitizeSvg -> sandboxed-srcdoc pipeline, never a shortcut. */
    if(/^svg$/i.test(lang))
      return {html:svgArtifactPlaceholder(unescEntities(body.join('\n'))),next:j};
    return {html:'<pre class="md-pre"><code'+(lang?' data-lang="'+lang+'"':'')+'>'+
      body.join('\n')+'</code></pre>',next:j};
  }
  var hm=line.match(/^ {0,3}(#{1,6})[ \t]+(.*?)[ \t]*#*[ \t]*$/);
  if(hm){var lvl=hm[1].length;
    return {html:'<h'+lvl+' class="md-h md-h'+lvl+'">'+renderInline(hm[2])+'</h'+lvl+'>',next:i+1}}
  if(/^ {0,3}((\*[ \t]*){3,}|(-[ \t]*){3,}|(_[ \t]*){3,})$/.test(line))
    return {html:'<hr class="md-hr">',next:i+1};
  var bqm=line.match(/^ {0,3}&gt;[ \t]?(.*)$/);
  if(bqm){
    var qlines=[bqm[1]],j=i+1;
    while(j<n){
      var qm=lines[j].match(/^ {0,3}&gt;[ \t]?(.*)$/);
      if(qm){qlines.push(qm[1]);j++;continue}
      if(/^[ \t]*$/.test(lines[j]))break;
      qlines.push(lines[j]);j++;
    }
    return {html:'<blockquote class="md-bq">'+renderBlocksFrom(qlines)+'</blockquote>',next:j};
  }
  var lim=listItemMatch(line);
  if(lim)return parseList(lines,i,n,lim.indent,lim.ordered);
  if(/\|/.test(line)&&i+1<n&&/^[ \t]*\|?[ \t:]*-+[ \t:]*(\|[ \t:]*-+[ \t:]*)*\|?[ \t]*$/.test(lines[i+1]))
    return parseTable(lines,i,n);
  var para=[line],j=i+1;
  while(j<n){
    var pl=lines[j];
    if(/^[ \t]*$/.test(pl))break;
    if(listItemMatch(pl))break;
    if(/^ {0,3}&gt;/.test(pl))break;
    if(/^ {0,3}(`{3,}|~{3,})/.test(pl))break;
    if(/^ {0,3}#{1,6}[ \t]/.test(pl))break;
    if(/^ {0,3}((\*[ \t]*){3,}|(-[ \t]*){3,}|(_[ \t]*){3,})$/.test(pl))break;
    para.push(pl);j++;
  }
  return {html:'<p class="md-p">'+para.map(renderInline).join('<br>')+'</p>',next:j};
}
function renderBlocksFrom(lines){
  var out=[],i=0,n=lines.length;
  while(i<n){
    if(/^[ \t]*$/.test(lines[i])){i++;continue}
    var r=parseBlock(lines,i,n);
    out.push(r.html); i=r.next>i?r.next:i+1;
  }
  return out.join('');
}
function mdRender(raw){
  var text=String(raw==null?'':raw).replace(/\r\n?/g,'\n').replace(/[\u0000\u0001\u0002]/g,'');
  return renderBlocksFrom(esc(text).split('\n'));
}

/* ---------- svg artifact (first inline artifact type — RFC-039 widget pipeline) ----------
   THE security boundary: this shell holds the operator's GitHub PAT in localStorage.
   Every SVG artifact renders inside a NULL-ORIGIN SANDBOXED IFRAME via srcdoc — the
   `sandbox` attribute below carries NEITHER `allow-scripts` NOR `allow-same-origin`,
   so the frame gets an opaque origin with scripting disabled outright. An opaque
   origin with no same-origin grant cannot read window.parent.localStorage /
   top.localStorage even if a hostile <script> made it into the markup — that denial
   IS the isolation, not a courtesy of the sanitizer below. sanitizeSvg() is
   defense-in-depth on top of the sandbox, never a substitute for it: it strips the
   obvious hostile surface (script, foreignObject, event handlers, external refs)
   before the string ever reaches srcdoc. The nested document also carries its own
   restrictive CSP meta, so even an external ref that slipped past the sanitizer
   still can't fetch (img-src is data: only, everything else default-src 'none').
   TODO(blob-ref artifact variant): today artifact.svg is an inline string. A future
   artifact.ref (content-addressed blob id / URL) variant should resolve to a string
   here and flow through this same sanitize -> srcdoc pipeline unchanged. */
function sanitizeSvg(raw){
  var s=String(raw==null?'':raw);
  s=s.replace(/<script\b[\s\S]*?<\/script\s*>/gi,'');
  s=s.replace(/<foreignObject\b[\s\S]*?<\/foreignObject\s*>/gi,'');
  s=s.replace(/\son[a-z]+\s*=\s*"(?:[^"\\]|\\.)*"/gi,'');
  s=s.replace(/\son[a-z]+\s*=\s*'(?:[^'\\]|\\.)*'/gi,'');
  s=s.replace(/\son[a-z]+\s*=\s*[^\s>]+/gi,'');
  s=s.replace(/\s(xlink:href|href|src)\s*=\s*"(?!data:)[^"]*"/gi,'');
  s=s.replace(/\s(xlink:href|href|src)\s*=\s*'(?!data:)[^']*'/gi,'');
  s=s.replace(/url\(\s*(['"]?)(?!data:)[\s\S]*?\1\s*\)/gi,'url()');
  return s;
}
function svgArtifactDoc(svg){
  return '<!doctype html><html><head><meta charset="utf-8">'+
    '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data:; style-src \'unsafe-inline\'">'+
    '<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}'+
    'svg{display:block;width:100%;height:100%}</style></head><body>'+
    sanitizeSvg(svg)+'</body></html>';
}
/* Builds the sandboxed-iframe placeholder AND registers the raw svg into svgDocs[] at the
   returned index — the ONE entry point both artifact sources (turn.artifact.svg, and a
   fenced ```svg block found by parseBlock below) go through, so there is exactly one place
   that ever calls sanitizeSvg/svgArtifactDoc and exactly one markup shape for the card. */
function svgArtifactPlaceholder(svgRaw){
  var idx=svgDocs.length; svgDocs.push(svgArtifactDoc(svgRaw));
  return '<div class="artifact artifact-svg"><div class="artifact-label">svg · sandboxed</div>'+
    '<iframe class="artifact-frame" sandbox="" data-svg-idx="'+idx+'"></iframe></div>';
}
/* Reverses esc() (undo the LATER replacements first, &amp; last) so a fenced ```svg block's
   ALREADY-ESCAPED body (mdRender esc()'d the whole turn text before any block parsing runs)
   gets back its literal < > " ' & before sanitizeSvg's tag/attribute regexes see it. Only
   used on that already-escaped, already-fenced text -- never on anything else. */
function unescEntities(s){
  return String(s==null?'':s).replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
}

/* ---------- chat ---------- */
function fetchLedger(){
  if(demo){renderChat(DEMO_TURNS);return}
  fetch(API+'/repos/'+cfg.repo+'/contents/conversations/ledger.json',{headers:hdr(true)})
    .then(function(r){if(!r.ok)throw new Error('ledger HTTP '+r.status);return r.json()})
    .then(function(d){$('err').textContent='';renderChat(d.turns||[])})
    .catch(function(e){$('err').textContent=e.message})
}
function renderChat(turns){
  var th=cfg.thread;
  var names={};turns.forEach(function(t){if(t.thread)names[t.thread]=1});
  var sel=$('thread');
  if(sel.options.length!==Object.keys(names).length){
    sel.innerHTML='';Object.keys(names).sort().forEach(function(n){
      var o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)})
  }
  sel.value=th;
  var mine=turns.filter(function(t){return (t.thread||'main')===th}).slice(-60);
  pending=pending.filter(function(p){return !mine.some(function(t){return t.id===p.id})});
  var log=$('log'), atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<80;
  svgDocs=[]; /* module-level — parseBlock's fenced-```svg branch pushes into this same
    array while mdRender() runs below, alongside the structured turn.artifact push here */
  log.innerHTML=mine.map(function(t){
    var isMine=(t.from||'').indexOf(cfg.dev)===0||(t.from||'').indexOf('chaz')===0;
    var artifactHtml=(t.artifact&&t.artifact.type==='svg')?svgArtifactPlaceholder(t.artifact.svg):'';
    return '<div class="turn'+(isMine?' mine':'')+'"><div class="meta">'+esc(t.from)+' · '+
      esc((t.ts||'').replace('T',' ').slice(0,16))+'</div><div class="body md-body">'+mdRender(t.text)+'</div>'+artifactHtml+'</div>'
  }).join('');
  /* srcdoc is set as a DOM property, not baked into the HTML string above — that
     keeps the sanitized document out of attribute-escaping entirely. */
  Array.prototype.forEach.call(log.querySelectorAll('iframe[data-svg-idx]'),function(f){
    f.srcdoc=svgDocs[+f.getAttribute('data-svg-idx')];
  });
  /* [#name] pills: wired via addEventListener post-render, same posture as the iframe
     loop above -- never an inline onclick= attribute in the generated markup. */
  Array.prototype.forEach.call(log.querySelectorAll('button.chan-pill'),function(b){
    b.addEventListener('click',function(){setChannel(b.getAttribute('data-channel'))});
  });
  $('pending').textContent=pending.length?pending.length+' sending…':'';
  $('asof').textContent=mine.length+' turns';
  if(atBottom)log.scrollTop=log.scrollHeight;
}
function send(){
  var text=$('msg').value.trim(); if(!text)return;
  if(demo){$('msg').value='';return}
  var id=Date.now()+'-'+cfg.dev;
  var turn={id:id,thread:cfg.thread,from:cfg.dev,ts:new Date().toISOString(),text:text,origin:'turn'};
  var body={count:1,turns:[turn]};
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(body,null,2)+'\n')));
  $('msg').value=''; pending.push(turn); $('pending').textContent=pending.length+' sending…';
  fetch(API+'/repos/'+cfg.repo+'/contents/conversations/inbox/'+id+'.json',{
    method:'PUT',headers:hdr(false),
    body:JSON.stringify({message:'chat receipt from '+cfg.dev,content:content,branch:'main'})
  }).then(function(r){if(!r.ok)throw new Error('send HTTP '+r.status);setTimeout(fetchLedger,1500)})
    .catch(function(e){$('err').textContent=e.message;
      pending=pending.filter(function(p){return p.id!==id})})
}

/* ---------- node ---------- */
function fetchSnap(){
  if(demo){renderNode(DEMO_SNAP);return}
  fetch(API+'/repos/'+snapRepo()+'/contents/constellation.json?ref='+encodeURIComponent(cfg.snap),{headers:hdr(true)})
    .then(function(r){if(!r.ok)throw new Error('snap HTTP '+r.status);return r.json()})
    .then(renderNode).catch(function(e){$('p-node').textContent=e.message})
}
function renderNode(s){
  var k=s.kernel||{};
  $('p-node').innerHTML='<span class="dot '+(k.status==='ok'?'ok':'bad')+'"></span>kernel '+esc(k.status)+
    ' / '+esc(k.state)+' · <span class="tag">'+esc(k.identity)+'</span><br><span class="dot '+
    (s.wake_line_watcher_alive?'ok':'bad')+'"></span>wake line '+(s.wake_line_watcher_alive?'alive':'DEAD')+
    '<br><span class="note">'+esc(s.generated_at)+'</span>';
  var t=s.topology||{};
  $('p-topo').innerHTML=t.shape?('<b>'+esc(t.shape)+'</b> · '+esc(t.nodes)+' nodes, '+esc(t.edges)+
    ' edges, '+esc(t.components)+' comp<br>λ₂ <b>'+esc(t.lambda2)+'</b> · ratio '+esc(t.spectral_ratio)+
    '<br><span class="note">hub '+esc(t.hub)+'</span>'):'—';
  $('p-sessions').innerHTML='<table><tr><th></th><th>session</th><th>role</th></tr>'+
    (s.sessions||[]).map(function(x){return '<tr><td>'+(x.active?'●':'○')+'</td><td>'+
      esc(x.session_id)+'</td><td>'+esc(x.role||'')+'</td></tr>'}).join('')+'</table>';
  var m=s.mod3||{},lm=Array.isArray(s.lms_models)?s.lms_models:[];
  $('p-voice').innerHTML=(m._unreachable?'<span class="dot bad"></span>mod3 unreachable':
    '<span class="dot ok"></span>mod3 · '+esc((m.engines||[]).join(', ')))+
    '<br><span class="dot '+(lm.length?'ok':'warn')+'"></span>'+esc(lm.join(', ')||'LMS unreachable');
  if(s.settled_intents&&s.settled_intents.length)
    logIntent(s.settled_intents.map(function(i){return i.id+' → '+i.outcome}).join(' · '));
}
function logIntent(m){var d=document.createElement('div');d.textContent=m;$('intent-log').prepend(d)}
function sendIntent(verb,extra){
  if(demo){logIntent('(demo) '+verb);return}
  var id=Date.now()+'-'+cfg.dev+'-'+verb;
  var body=Object.assign({verb:verb,from:cfg.dev,requested_at:new Date().toISOString()},extra||{});
  fetch(API+'/repos/'+snapRepo()+'/contents/intents/inbox/'+id+'.json',{
    method:'PUT',headers:hdr(false),
    body:JSON.stringify({message:'intent receipt: '+verb,
      content:btoa(unescape(encodeURIComponent(JSON.stringify(body,null,2)+'\n'))),branch:cfg.snap})
  }).then(function(r){logIntent(r.ok?('sent '+verb+' — pending'):('failed HTTP '+r.status))})
    .catch(function(e){logIntent('failed: '+e.message)})
}

/* ---------- shell ---------- */
// Single-endpoint routing: eigen.forum/theseus?channel=<thread> deep-links a
// channel. GitHub Pages is static and ignores the query for file resolution, so
// ONE file serves every channel and the JS reads the param — no server redirect,
// no per-channel file, no 404 fallback needed. Query is his form; #hash is the
// fully-static fallback (works even off a file:// origin). The channel is a UX
// preselect only; it grants no access — the PAT is the sole data gate.
function urlChannel(){
  try{
    var q=new URLSearchParams(location.search).get('channel');
    if(q&&/^[\w-]+$/.test(q))return q;
    var h=(location.hash||'').replace(/^#/,'');
    if(!h||h==='demo')return null;
    var m=h.match(/channel=([\w-]+)/); if(m)return m[1];
    if(/^[\w-]+$/.test(h))return h;
  }catch(e){}
  return null;
}
// Reflect the open channel in the address bar so copying the URL is a deep link.
function syncUrl(){
  if(demo)return;
  try{history.replaceState(null,'',location.pathname+'?channel='+encodeURIComponent(cfg.thread));}catch(e){}
}
/* THE one channel-switch path: the #thread dropdown's onchange and every rendered
   [#name] pill both call this, and only this, to move channels. Re-validates the
   channel-name charset regardless of caller -- render-time already restricted a pill's
   data-channel to this same charset, but this is the point that actually mutates
   cfg.thread, so it checks again rather than trusting the caller. */
function setChannel(name){
  if(!/^[A-Za-z0-9._-]+$/.test(String(name||'')))return;
  cfg.thread=name; save(); syncUrl(); fetchLedger();
}
function tab(n){
  ['chat','node','cfg'].forEach(function(x){
    $('v-'+x).classList.toggle('on',x===n); $('tab-'+x).classList.toggle('on',x===n)});
  if(n==='node')fetchSnap();
}
$('tab-chat').onclick=function(){tab('chat')};
$('tab-node').onclick=function(){tab('node')};
$('tab-cfg').onclick=function(){tab('cfg')};
$('send').onclick=send;
$('msg').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send()}});
$('thread').onchange=function(){setChannel(this.value)};
$('i-refresh').onclick=function(){sendIntent('refresh')};
$('i-speak').onclick=function(){var t=$('i-speak-text').value.trim();
  if(t){sendIntent('speak',{text:t});$('i-speak-text').value=''}};
$('cfg-clear').onclick=function(){try{for(var k in K)localStorage.removeItem(K[k])}catch(e){}location.reload()};
$('cfg-save').onclick=function(){
  var r=$('cfg-repo').value.trim();
  if(!demo&&!/^[\w.-]+\/[\w.-]+$/.test(r)){$('err').textContent='repo must be owner/repo';return}
  if(!demo&&!$('cfg-token').value.trim()){$('err').textContent='a token is required';return}
  cfg.repo=r; cfg.token=$('cfg-token').value.trim();
  cfg.dev=$('cfg-device').value.trim()||'phone';
  cfg.snap=$('cfg-snap').value.trim()||'constellation-live';
  cfg.snaprepo=$('cfg-snaprepo').value.trim();
  save(); start();
};

function start(){
  tab('chat'); syncUrl(); fetchLedger();
  if(timer)clearInterval(timer);
  timer=setInterval(function(){ if($('v-chat').classList.contains('on'))fetchLedger();
                                else if($('v-node').classList.contains('on'))fetchSnap() },POLL_MS);
}

// Register the shell service worker so eigen.forum installs as a home-screen
// app and works offline. The worker caches ONLY the shell (page, manifest,
// icons) and never touches api.github.com — the ledger and your token are
// never cached, exactly the book shell's discipline. Best-effort; a failed
// registration just means no offline, never a broken page.

  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
